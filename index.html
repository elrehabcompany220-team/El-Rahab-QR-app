<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>الرحاب | QR</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#DE1B2B">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="الرحاب QR">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F6F3ED;
    --surface:#FFFFFF;
    --surface-2:#EFEAE1;
    --text:#171F2E;
    --text-muted:#6B7383;
    --red:#DE1B2B;
    --red-dark:#AD121F;
    --navy:#13213D;
    --navy-2:#20345C;
    --steel:#CDD3DD;
    --gold:#B9843E;
    --border:#E2DCD0;
    --radius:16px;
    --shadow:0 14px 34px -16px rgba(19,33,61,.30);
    --font-body:'Tajawal',sans-serif;
    --font-num:'Oswald',sans-serif;
  }
  .theme-dark{
    --bg:#0A0F1C;
    --surface:#111B2E;
    --surface-2:#16233A;
    --text:#EEF1F6;
    --text-muted:#8C97AC;
    --red:#FF3B47;
    --red-dark:#DE1B2B;
    --navy:#1C2C4E;
    --navy-2:#28406E;
    --steel:#2C3A57;
    --gold:#E3AC64;
    --border:#22304C;
    --shadow:0 14px 34px -16px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    transition:background .25s ease,color .25s ease;
  }
  #app{
    max-width:760px;margin:0 auto;min-height:100vh;position:relative;
    padding:calc(18px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
  }
  [dir="ltr"] body{font-family:var(--font-body);}
  a{color:inherit;}
  button,input,select,textarea{font-family:var(--font-body);}
  /* iOS: inputs need >=16px font-size or the page auto-zooms on focus */
  input,select,textarea{font-size:16px !important;}

  @media (max-width:400px){
    .hero h1{font-size:22px;}
    .brand-txt .b-ar{font-size:13px;}
    .tag-card h3{font-size:15.5px;}
    .screen-head h2{font-size:17px;}
  }
  @media (hover:none){
    .tag-card:hover, .quick-chip:hover, .icon-btn:hover, .prod-row:hover{transform:none;}
    .tag-card:active{transform:scale(.98);}
    .icon-btn:active, .quick-chip:active, .prod-row:active{opacity:.75;}
    .btn-primary:active{background:var(--red-dark);}
    .btn-secondary:active{border-color:var(--navy);}
  }

  /* ---------- Top bar ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .brand img{width:46px;height:46px;object-fit:cover;border-radius:10px;box-shadow:var(--shadow);}
  .brand-txt{display:flex;flex-direction:column;line-height:1.25;}
  .brand-txt .b-ar{font-weight:900;font-size:15px;letter-spacing:.2px;}
  .brand-txt .b-en{font-weight:500;font-size:10.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;}
  .icon-btn{
    width:42px;height:42px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--text);transition:.15s ease;flex-shrink:0;
  }
  .icon-btn:hover{border-color:var(--red);color:var(--red);transform:translateY(-1px);}
  .icon-btn svg{width:19px;height:19px;}
  .topbar-actions{display:flex;gap:8px;}

  /* ---------- Hero ---------- */
  .hero{margin:6px 0 26px;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
    color:var(--red);background:color-mix(in srgb, var(--red) 10%, transparent);
    padding:5px 12px;border-radius:100px;letter-spacing:.5px;margin-bottom:12px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--red);}
  .hero h1{font-size:26px;font-weight:900;margin:0 0 6px;line-height:1.35;}
  .hero p{margin:0;color:var(--text-muted);font-size:13.5px;line-height:1.7;max-width:46ch;}

  /* ---------- Tag cards (signature element) ---------- */
  .tag-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px;}
  @media(max-width:520px){.tag-grid{grid-template-columns:1fr;}}
  .tag-card{
    position:relative;background:var(--surface);border:1px solid var(--border);
    border-radius:20px;padding:26px 20px 22px;cursor:pointer;overflow:hidden;
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    box-shadow:var(--shadow);
  }
  .tag-card:hover{transform:translateY(-3px);border-color:var(--red);}
  .tag-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg,var(--red),var(--gold));
  }
  .tag-card .hole{
    position:absolute;top:-10px;right:22px;width:20px;height:20px;border-radius:50%;
    background:var(--bg);border:1px solid var(--border);
  }
  [dir="ltr"] .tag-card .hole{right:auto;left:22px;}
  .tag-card .ic{
    width:50px;height:50px;border-radius:14px;display:flex;align-items:center;justify-content:center;
    background:var(--surface-2);color:var(--navy);margin-bottom:16px;
  }
  .theme-dark .tag-card .ic{color:var(--gold);}
  .tag-card .ic svg{width:24px;height:24px;}
  .tag-card h3{margin:0 0 6px;font-size:16.5px;font-weight:800;}
  .tag-card p{margin:0;font-size:12.5px;color:var(--text-muted);line-height:1.6;}
  .tag-card .go{
    position:absolute;bottom:20px;inset-inline-end:20px;width:30px;height:30px;border-radius:50%;
    background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;
  }
  .tag-card .go svg{width:14px;height:14px;transform:scaleX(var(--flip,1));}
  [dir="rtl"] .tag-card .go svg{transform:scaleX(-1);}

  /* quick link row */
  .quick-row{display:flex;gap:10px;margin-top:16px;}
  .quick-chip{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--surface-2);border:1px dashed var(--border);border-radius:12px;
    padding:12px;font-size:12.5px;font-weight:700;color:var(--text);cursor:pointer;transition:.15s;
  }
  .quick-chip:hover{border-color:var(--gold);color:var(--gold);}
  .quick-chip svg{width:15px;height:15px;}
  .quick-chip b{font-family:var(--font-num);font-size:14px;}

  /* ---------- Generic screen header ---------- */
  .screen-head{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
  .back-btn{
    width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);
  }
  .back-btn svg{width:16px;height:16px;transform:scaleX(-1);}
  [dir="rtl"] .back-btn svg{transform:scaleX(1);}
  .screen-head h2{font-size:19px;font-weight:900;margin:0;}
  .screen-head span{display:block;font-size:11.5px;color:var(--text-muted);font-weight:500;margin-top:2px;}

  /* ---------- Form ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:7px;color:var(--text);}
  .field .hint{font-size:10.5px;color:var(--text-muted);font-weight:400;margin-inline-start:6px;}
  .field input[type=text],.field input[type=number],.field textarea,.field select{
    width:100%;background:var(--bg);border:1px solid var(--border);border-radius:11px;
    padding:12px 13px;font-family:var(--font-body);font-size:13.5px;color:var(--text);outline:none;transition:.15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--red);background:var(--surface);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:480px){.row2{grid-template-columns:1fr;}}
  .chip-input{display:flex;gap:8px;}
  .chip-input input{flex:1;}
  .chip-input button{
    background:var(--navy);color:#fff;border:none;border-radius:11px;padding:0 16px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .theme-dark .chip-input button{background:var(--red);}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
  .chip{
    display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
    padding:6px 10px;border-radius:100px;font-size:12px;font-weight:600;
  }
  .chip button{background:none;border:none;color:var(--red);font-size:14px;cursor:pointer;line-height:1;padding:0;font-weight:900;}
  .img-drop{
    border:1.5px dashed var(--border);border-radius:14px;padding:18px;text-align:center;cursor:pointer;
    background:var(--bg);position:relative;overflow:hidden;min-height:120px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  }
  .img-drop:hover{border-color:var(--gold);}
  .img-drop img{max-width:100%;max-height:180px;border-radius:10px;}
  .img-drop svg{width:26px;height:26px;color:var(--text-muted);}
  .img-drop span{font-size:12px;color:var(--text-muted);font-weight:600;}
  .img-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;}

  .btn-primary{
    width:100%;background:var(--red);color:#fff;border:none;border-radius:13px;padding:15px;
    font-family:var(--font-body);font-size:14.5px;font-weight:800;cursor:pointer;transition:.15s;
    display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 24px -10px color-mix(in srgb, var(--red) 70%, transparent);
  }
  .btn-primary:hover{background:var(--red-dark);}
  .btn-primary svg{width:16px;height:16px;}
  .btn-secondary{
    width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:13px;padding:14px;
    font-family:var(--font-body);font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-secondary:hover{border-color:var(--navy);}
  .btn-danger{color:var(--red);}
  .err-box{background:color-mix(in srgb, var(--red) 10%, transparent);color:var(--red);border:1px solid color-mix(in srgb, var(--red) 30%, transparent);
    padding:10px 13px;border-radius:11px;font-size:12.5px;font-weight:700;margin-bottom:14px;}

  /* ---------- Inquiry ---------- */
  .scan-tabs{display:flex;gap:8px;margin-bottom:18px;background:var(--surface-2);padding:5px;border-radius:13px;}
  .scan-tab{flex:1;text-align:center;padding:10px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--text-muted);}
  .scan-tab.active{background:var(--surface);color:var(--red);box-shadow:var(--shadow);}
  .cam-wrap{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;max-width:340px;margin:0 auto;}
  .cam-wrap video{width:100%;height:100%;object-fit:cover;}
  .cam-frame{position:absolute;inset:14%;border:3px solid var(--gold);border-radius:20px;box-shadow:0 0 0 999px rgba(0,0,0,.35);}
  .cam-hint{text-align:center;font-size:11.5px;color:var(--text-muted);margin-top:12px;}
  .perm-note{
    display:flex;align-items:flex-start;gap:9px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:12px;padding:11px 13px;margin-top:12px;font-size:11.5px;line-height:1.6;color:var(--text-muted);
  }
  .perm-note svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;color:var(--gold);}
  .manual-row{display:flex;gap:8px;}
  .manual-row input{flex:1;}

  /* ---------- Product detail ---------- */
  .tag-label{
    background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:0;overflow:hidden;box-shadow:var(--shadow);position:relative;
  }
  .tag-label .top-strip{height:6px;background:linear-gradient(90deg,var(--navy),var(--red),var(--gold));}
  .tag-label .photo{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--surface-2);display:block;}
  .tag-label .body{padding:20px;}
  .tag-label h2{margin:0 0 4px;font-size:19px;font-weight:900;}
  .tag-label .cat{font-size:11.5px;color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
  .spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .spec{background:var(--surface-2);border-radius:12px;padding:11px 13px;}
  .spec .k{font-size:10.5px;color:var(--text-muted);font-weight:700;margin-bottom:4px;}
  .spec .v{font-size:13px;font-weight:800;}
  .price-tag{
    display:inline-flex;align-items:baseline;gap:5px;background:var(--navy);color:#fff;padding:9px 16px;border-radius:11px;font-family:var(--font-num);
    margin-bottom:16px;
  }
  .price-tag .num{font-size:19px;font-weight:700;}
  .price-tag .cur{font-size:11px;opacity:.8;}
  .qr-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2);border-radius:14px;padding:18px;margin-top:6px;}
  .qr-wrap .code{font-family:var(--font-num);font-size:11px;color:var(--text-muted);letter-spacing:1px;}
  .action-row{display:flex;gap:10px;margin-top:16px;}

  /* ---------- Catalog ---------- */
  .search-box{position:relative;margin-bottom:16px;}
  .search-box input{width:100%;padding:12px 40px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-family:var(--font-body);font-size:13.5px;outline:none;}
  .search-box svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:13px;width:16px;height:16px;color:var(--text-muted);}
  .prod-list{display:flex;flex-direction:column;gap:10px;}
  .prod-row{
    display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;transition:.15s;
  }
  .prod-row:hover{border-color:var(--red);}
  .prod-row img{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--surface-2);flex-shrink:0;}
  .prod-row .pi{flex:1;min-width:0;}
  .prod-row .pi h4{margin:0 0 2px;font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prod-row .pi span{font-size:11px;color:var(--text-muted);}
  .prod-row .pp{font-family:var(--font-num);font-weight:700;font-size:13px;color:var(--red);flex-shrink:0;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--text-muted);}
  .empty-state svg{width:44px;height:44px;margin-bottom:14px;opacity:.5;}
  .empty-state p{font-size:13px;margin:0;}

  /* ---------- Settings ---------- */
  .set-row{
    display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);
    border-radius:14px;padding:15px 16px;margin-bottom:12px;
  }
  .set-row .si{display:flex;align-items:center;gap:12px;}
  .set-row .icwrap{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--navy);}
  .theme-dark .set-row .icwrap{color:var(--gold);}
  .set-row .icwrap svg{width:17px;height:17px;}
  .set-row h4{margin:0 0 2px;font-size:13.5px;font-weight:800;}
  .set-row span{font-size:11px;color:var(--text-muted);}
  .seg{display:flex;background:var(--surface-2);border-radius:100px;padding:3px;gap:2px;}
  .seg button{border:none;background:none;padding:9px 15px;min-height:36px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-muted);font-family:var(--font-body);}
  .seg button.on{background:var(--red);color:#fff;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:12px 22px;border-radius:100px;font-size:13px;font-weight:700;box-shadow:var(--shadow);z-index:999;
    opacity:0;pointer-events:none;transition:.25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  #print-area{display:none;}
  .print-tag{width:280px;margin:0 auto;text-align:center;font-family:var(--font-body);border:2px solid #13213D;border-radius:14px;padding:16px;background:#fff;color:#13213D;}
  .print-tag h5{margin:8px 0 2px;font-size:15px;}
  .print-tag p{margin:0;font-size:11px;color:#555;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block !important;position:fixed;top:0;left:0;width:100%;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================

/* =========================================================
   STANDALONE STORAGE — this build runs outside Claude, so it
   uses the browser's own localStorage instead of Claude's
   window.storage bridge. Same method names/signatures are kept
   (get/set/delete, all async) so nothing else in the app had to
   change. Data is saved locally on THIS device/browser only —
   it does not sync between different phones/computers.
========================================================= */
window.storage = (function(){
  const NS = 'rahab_qr_app::';
  function k(key){ return NS + key; }
  return {
    async get(key, shared){
      try{
        const raw = localStorage.getItem(k(key));
        if(raw === null || raw === undefined) return null;
        return { key, value: raw, shared: !!shared };
      }catch(e){ return null; }
    },
    async set(key, value, shared){
      try{
        localStorage.setItem(k(key), value);
        return { key, value, shared: !!shared };
      }catch(e){ return null; }
    },
    async delete(key, shared){
      try{
        localStorage.removeItem(k(key));
        return { key, deleted:true, shared: !!shared };
      }catch(e){ return null; }
    },
    async list(prefix, shared){
      try{
        const keys = [];
        const pfx = k(prefix||'');
        for(let i=0;i<localStorage.length;i++){
          const full = localStorage.key(i);
          if(full && full.indexOf(pfx)===0) keys.push(full.slice(NS.length));
        }
        return { keys, prefix, shared: !!shared };
      }catch(e){ return null; }
    }
  };
})();

/* =========================================================
   SHARED DATABASE (optional) — a Google Apps Script "Web App"
   backed by a Google Sheet. If configured, product data is read
   and written there instead of localStorage, so every device that
   points at the same URL sees the same live product catalog.
   If not configured, the app quietly falls back to the local
   storage shim above (per-device only), exactly as before.
========================================================= */
let DB_URL = localStorage.getItem('rahab_db_url') || '';
function hasRemoteDB(){ return !!DB_URL; }
function setDbUrl(url){ DB_URL = (url||'').trim(); if(DB_URL) localStorage.setItem('rahab_db_url', DB_URL); else localStorage.removeItem('rahab_db_url'); }

async function remoteFetchList(){
  const res = await fetch(DB_URL + '?action=list');
  if(!res.ok) throw new Error('network');
  const json = await res.json();
  return json.products || [];
}
async function remoteGet(id){
  const res = await fetch(DB_URL + '?action=get&id=' + encodeURIComponent(id));
  if(!res.ok) throw new Error('network');
  const json = await res.json();
  return json.product || null;
}
async function remoteSave(product){
  const res = await fetch(DB_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'save', product })
  });
  if(!res.ok) throw new Error('network');
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return true;
}
async function remoteDelete(id){
  const res = await fetch(DB_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'delete', id })
  });
  if(!res.ok) throw new Error('network');
  return true;
}
async function testRemoteConnection(){
  await remoteFetchList();
  return true;
}

/* ---------------- persistence ---------------- */
async function loadSettings(){
  try{
    const r = await window.storage.get('settings', false);
    if(r && r.value){
      const s = JSON.parse(r.value);
      if(s.lang) state.lang = s.lang;
      if(s.theme) state.theme = s.theme;
    }
  }catch(e){ /* no settings yet */ }
}
async function saveSettings(){
  try{
    await window.storage.set('settings', JSON.stringify({lang:state.lang, theme:state.theme}), false);
  }catch(e){ console.error('settings save failed', e); }
}
async function loadIndex(){
  try{
    const r = await window.storage.get('product-index', true);
    return r && r.value ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveIndex(ids){
  try{
    await window.storage.set('product-index', JSON.stringify(ids), true);
  }catch(e){ console.error('index save failed', e); }
}
async function saveProduct(p){
  if(hasRemoteDB()){
    try{ await remoteSave(p); return true; }
    catch(e){ console.error('remote save failed', e); return false; }
  }
  try{
    const res = await window.storage.set('product:'+p.id, JSON.stringify(p), true);
    if(res){
      const ids = await loadIndex();
      if(!ids.includes(p.id)){ ids.unshift(p.id); await saveIndex(ids); }
    }
    return !!res;
  }catch(e){ console.error('product save failed', e); return false; }
}
async function getProduct(id){
  if(hasRemoteDB()){
    try{ return await remoteGet(id); }
    catch(e){ console.error('remote get failed', e); return null; }
  }
  try{
    const r = await window.storage.get('product:'+id, true);
    return r && r.value ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function deleteProductStorage(id){
  if(hasRemoteDB()){
    try{ await remoteDelete(id); }catch(e){ console.error('remote delete failed', e); }
    return;
  }
  try{ await window.storage.delete('product:'+id, true); }catch(e){}
  const ids = await loadIndex();
  const next = ids.filter(x=>x!==id);
  await saveIndex(next);
}
async function loadAllProducts(){
  state.productsLoading = true;
  if(hasRemoteDB()){
    try{
      const list = await remoteFetchList();
      list.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
      state.products = list;
    }catch(e){
      console.error('remote list failed', e);
      state.products = [];
      state.productsLoadError = true;
    }
    state.productsLoading = false;
    state.productsLoaded = true;
    return;
  }
  const ids = await loadIndex();
  const list = [];
  for(const id of ids){
    const p = await getProduct(id);
    if(p) list.push(p);
  }
  list.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  state.products = list;
  state.productsLoading = false;
  state.productsLoaded = true;
}

/* ---------------- image resize ---------------- */
function resizeImage(file, maxW){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function updateChipsUI(){
  document.getElementById('colorsChips').innerHTML = draftColors.map((c,i)=>
    `<div class="chip">${esc(c)}<button onclick="removeChip('color',${i})">&times;</button></div>`).join('');
  document.getElementById('sizesChips').innerHTML = draftSizes.map((c,i)=>
    `<div class="chip">${esc(c)}<button onclick="removeChip('size',${i})">&times;</button></div>`).join('');
}
function addChip(kind){
  const inputId = kind==='color' ? 'f_color_in' : 'f_size_in';
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  if(kind==='color') draftColors.push(val); else draftSizes.push(val);
  input.value = '';
  input.focus();
  updateChipsUI();
}
function removeChip(kind,i){
  if(kind==='color') draftColors.splice(i,1); else draftSizes.splice(i,1);
  updateChipsUI();
}
function handleImageInput(ev){

function inquiryScreen(){

    <div class="scan-tab ${state.scanTab==='manual'?'active':''}" onclick="setScanTab('manual')">${esc(t('scan_manual'))}</div>

}
function setScanTab(tab){
  stopCamera();
  state.scanTab = tab;
  render();
  renderScanArea();
}
function renderScanArea(){
  const area = document.getElementById('scanArea');
  if(!area) return;
  if(state.scanTab==='camera'){
    area.innerHTML = `
      <div class="cam-wrap" id="camWrap">
        <video id="camVideo" playsinline muted></video>
        <div class="cam-frame"></div>
      </div>
      <p class="cam-hint">${esc(t('cam_hint'))}</p>
      ${!state.camStream ? `<div class="perm-note">${ICONS.lock}<span>${esc(t('cam_perm_note'))}</span></div>` : ''}
      <div style="margin-top:14px;"><button class="btn-secondary" id="camToggleBtn" onclick="toggleCamera()">${ICONS.camera}${esc(t('cam_start'))}</button></div>
      <canvas id="camCanvas" style="display:none;"></canvas>
    `;
  }else if(state.scanTab==='image'){
    area.innerHTML = `
      <div class="img-drop" style="min-height:150px;">

      </div>
      <button class="btn-primary" style="margin-top:12px;" onclick="submitManualCode()">${ICONS.search}${esc(t('manual_btn'))}</button>
    `;
  }
}
function setScanMsg(html){
  const m = document.getElementById('scanMsg');
  if(m) m.innerHTML = html;
}

async function toggleCamera(){
  if(state.camStream){ stopCamera(); renderScanArea(); return; }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setScanMsg(`<div class="err-box">${esc(t('cam_denied'))}</div>`);
    return;
  }
  try{
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    }catch(e1){
      stream = await navigator.mediaDevices.getUserMedia({video:true});
    }
    state.camStream = stream;
    const video = document.getElementById('camVideo');
    video.srcObject = stream;
    await video.play();
    const btn = document.getElementById('camToggleBtn');
    if(btn) btn.innerHTML = ICONS.camera + t('cam_stop');
    scanLoop();
  }catch(e){
    setScanMsg(`<div class="err-box">${esc(t('cam_denied'))}</div>`);
  }
}
function stopCamera(){
  if(state.camLoop){ cancelAnimationFrame(state.camLoop); state.camLoop=null; }
  if(state.camStream){
    state.camStream.getTracks().forEach(tr=>tr.stop());
    state.camStream = null;
  }
}
function scanLoop(){
  const video = document.getElementById('camVideo');
  const canvas = document.getElementById('camCanvas');
  if(!video || !canvas){ return; }
  if(video.readyState === video.HAVE_ENOUGH_DATA){
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(imgData.data, imgData.width, imgData.height);
    if(code && code.data){
      stopCamera();
      resolveScannedCode(code.data);
      return;
    }
  }
  state.camLoop = requestAnimationFrame(scanLoop);
}
function handleQrImageUpload(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height);
      if(code && code.data){
        resolveScannedCode(code.data);
      }else{
        setScanMsg(`<div class="err-box">${esc(t('invalid_qr'))}</div>`);
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function submitManualCode(){
  const val = document.getElementById('manualCode').value.trim();
  if(!val) return;
  resolveScannedCode(val);
}
async function resolveScannedCode(raw){
  setScanMsg(`<p class="cam-hint">...</p>`);
  let id = raw;
  const m = raw.match(/RAHAB-PROD::(.+)/);
  if(m) id = m[1];
  const product = await getProduct(id.trim());
  if(product){
    state.current = product;
    state.fromInquiry = true;
    goto('detail');
  }else{
    setScanMsg(`<div class="err-box">${esc(t('not_found'))}</div>`);
  }
}

function renderProdList(items){

  }
  return items.map(p=>`

function filterCatalog(){

  const filtered = !q ? state.products : state.products.filter(p=> (p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q));
  const list = document.getElementById('prodList');
  list.innerHTML = filtered.length ? renderProdList(filtered) : `<div class="empty-state">${ICONS.search}<p>${esc(t('empty_search'))}</p></div>`;

function buildTagMarkup(p){
  return `<div class="print-tag" id="tagCaptureBox">
    <img src="${LOGO_SRC}" style="width:40px;height:40px;border-radius:8px;object-fit:cover;"/>
    <h5>${esc(p.name)}</h5>
    <p>${esc(p.category||'')}</p>
    <div id="tagQR" style="margin:10px auto;"></div>
    <p style="font-family:'Oswald',sans-serif;letter-spacing:1px;">${esc(p.id)}</p>
    <p>${esc(p.price?p.price+' '+(p.currency||''):'')}</p>
  </div>`;
}
function printTag(){
  const p = state.current;
  if(!p) return;
  const area = document.getElementById('print-area');
  area.innerHTML = buildTagMarkup(p);
  new QRCode(document.getElementById('tagQR'), {
    text:'RAHAB-PROD::'+p.id, width:150, height:150, colorDark:'#13213D', colorLight:'#ffffff'
  });
  setTimeout(()=>{ window.print(); }, 150);
}
window.addEventListener('afterprint', ()=>{ document.getElementById('print-area').innerHTML=''; });

function sanitizeFilename(str){
  return (str||'product').toString().trim().replace(/[\\/:*?"<>|]+/g,'-').slice(0,60) || 'product';
}
async function downloadTagPDF(){
  const p = state.current;
  if(!p) return;
  const btn = document.getElementById('pdfBtn');
  if(btn){ btn.disabled = true; btn.style.opacity = .6; }
  try{
    const area = document.getElementById('print-area');
    area.innerHTML = buildTagMarkup(p);
    area.style.cssText = 'display:block;position:fixed;top:0;left:-9999px;z-index:-1;';
    new QRCode(document.getElementById('tagQR'), {
      text:'RAHAB-PROD::'+p.id, width:150, height:150, colorDark:'#13213D', colorLight:'#ffffff'
    });
    await new Promise(r=>setTimeout(r, 200));
    const box = document.getElementById('tagCaptureBox');
    const canvas = await html2canvas(box, {scale:3, backgroundColor:'#ffffff'});
    const imgData = canvas.toDataURL('image/png');
    const mmW = box.offsetWidth * 25.4 / 96;
    const mmH = box.offsetHeight * 25.4 / 96;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'mm', format:[mmW, mmH] });
    doc.addImage(imgData, 'PNG', 0, 0, mmW, mmH);
    doc.save(sanitizeFilename(p.name) + '-' + p.id + '.pdf');
    area.style.cssText = 'display:none;';
    area.innerHTML = '';
  }catch(e){
    console.error('PDF generation failed', e);
    showToast(t('pdf_error'));
  }finally{
    if(btn){ btn.disabled = false; btn.style.opacity = 1; }
  }
}

/* ---------------- Install as app (PWA) ---------------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('installBtn');
  if(btn) btn.style.display = 'flex';
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null;
  showToast(t('installed_toast'));
  if(state.screen==='settings') render();
});
function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
async function installApp(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  }else{
    showToast(t('install_manual_hint_toast'));
  }
}
